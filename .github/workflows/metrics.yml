name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sathkeerthi
          # template: classic
          base: header
          # base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          committer_message: "chore: update metrics"

          ## Plugins you want to display
          # plugin_isocalendar: yes    # declared below
          # plugin_languages: yes      # declared below
          # plugin_followup: yes
          # plugin_lines: yes
          # plugin_achievements: yes
          # plugin_stars: yes
          # plugin_habits: yes

          # isocalendar (3D commit calendar)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # activity
          plugin_activity: yes
          plugin_activity_limit: 2
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_timestamps: yes

          # interesting facts
          plugin_habits_facts: yes

          # Languages
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Featured repositories
          # plugin_repositories: yes
          # plugin_repositories_featured: "AuthForge, student-management-system-springboot-react, LeetCode-DSA"


          # Topics (might delete)
          # plugin_topics: yes

          # Leetcode
          plugin_leetcode: yes
          plugin_leetcode_user: syagni
          plugin_leetcode_sections: solved, recent




